name: render

# Phone → GitHub Actions. The page in /cloud dispatches this with a source URL,
# then downloads render-<run_number> and deletes it.
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: 'Video URL (tmpfiles.org page link, direct mp4, or YouTube/TikTok/Twitch link)'
        required: true
        type: string
      mode:
        description: 'Clip mode (podcast = speech highlights, gaming = action highlights)'
        required: false
        default: 'podcast'
        type: string
      count:
        description: 'How many clips (1-8)'
        required: false
        default: '4'
        type: string
      template:
        description: 'Caption template (pop | karaoke | box | neon)'
        required: false
        default: 'pop'
        type: string
      look:
        description: 'Colour look id (none = untouched)'
        required: false
        default: 'none'
        type: string
      music:
        description: 'Music (auto | none)'
        required: false
        default: 'auto'
        type: string
      title:
        description: 'Optional title / hook over the speaker card'
        required: false
        default: ''
        type: string
      broll:
        description: 'B-roll inserts (on | off)'
        required: false
        default: 'on'
        type: string
      source_release_tag:
        description: 'Optional: release tag holding the source, deleted after the render'
        required: false
        default: ''
        type: string
      fps:
        description: 'Max output frame rate (30 | 60; a higher-fps source is capped)'
        required: false
        default: '30'
        type: string

concurrency:
  group: render
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    # Pinned: ubuntu-latest is moving to 26.04 during Nov 2026.
    runs-on: ubuntu-24.04
    # A hung apt mirror must never hold the concurrency queue for hours.
    timeout-minutes: 120
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      HWACCEL: cpu
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      CF_QUIET: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        # apt mirrors on the Azure images hang regularly (hours-long freezes);
        # every command gets a hard timeout and a retry, and if apt still fails
        # a static ffmpeg from GitHub releases lands in /usr/bin instead.
        run: |
          set -e
          if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -version | head -n 1; exit 0; fi
          try_update() {
            timeout 150 sudo apt-get update -qq || echo "apt-get update failed/timed out (attempt $1)"
          }
          try_install() {
            timeout 300 sudo apt-get install -y -qq --no-install-recommends ffmpeg
          }
          ok=0
          for i in 1 2; do
            try_update "$i" || true
            if try_install; then ok=1; break; fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo "apt failed twice - falling back to a static ffmpeg build"
            curl -fsSL --retry 3 -o /tmp/ff.tar.xz \
              https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ff.tar.xz -C /tmp
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /usr/bin/ffmpeg
            sudo cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/bin/ffprobe
            sudo chmod +x /usr/bin/ffmpeg /usr/bin/ffprobe
          fi
          ffmpeg -version | head -n 2
          ffprobe -version | head -n 1

      # Pinned yt-dlp build for YouTube / TikTok / Twitch links (the same
      # version proven on the laptop). ~15 MB, a few seconds to fetch.
      - name: Install yt-dlp
        run: |
          curl -fsSL -o /usr/local/bin/yt-dlp https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux
          chmod +x /usr/local/bin/yt-dlp
          yt-dlp --version

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Download source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          node scripts/fetch-source.mjs --url "$SOURCE_URL" --out source.mp4
          du -h source.mp4

      - name: Render
        env:
          MODE: ${{ inputs.mode }}
          COUNT: ${{ inputs.count }}
          TEMPLATE: ${{ inputs.template }}
          LOOK: ${{ inputs.look }}
          MUSIC: ${{ inputs.music }}
          TITLE: ${{ inputs.title }}
          BROLL: ${{ inputs.broll }}
          FPS: ${{ inputs.fps }}
        run: |
          node scripts/cloud-render.mjs \
            --src source.mp4 --out out \
            --mode "$MODE" --count "$COUNT" --template "$TEMPLATE" --look "$LOOK" \
            --music "$MUSIC" --title "$TITLE" --broll "$BROLL" --max-fps "$FPS"

      - name: Notes
        env:
          TITLE: ${{ inputs.title }}
        run: node scripts/release-notes.mjs --manifest out/manifest.json --out release-body.md --title "$TITLE"

      - name: Zip
        run: |
          cd out
          zip -q -j clips.zip clip-*.mp4 manifest.json
          ls -lh

      - name: Publish release
        if: success()
        run: |
          TAG="render-${{ github.run_number }}"
          # Re-running the same job keeps the run number: clear a stale tag first.
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "$TAG" \
            out/clip-*.mp4 out/clip-*.jpg out/manifest.json out/clips.zip \
            --title "Clips · run ${{ github.run_number }}" \
            --notes-file release-body.md
          {
            echo "### ✅ Clips ready"
            echo ""
            echo "Mode: \`${{ inputs.mode }}\` · max fps: \`${{ inputs.fps }}\`"
            echo "Tag: \`$TAG\`"
            echo ""
            echo "Open the phone page and download, then delete the release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Drop source release
        if: always() && inputs.source_release_tag != ''
        env:
          TAG: ${{ inputs.source_release_tag }}
        run: gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-log-${{ github.run_number }}
          path: |
            out/log.txt
            out/manifest.json
          if-no-files-found: ignore
          retention-days: 3
